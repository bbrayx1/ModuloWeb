<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logueo Comedor - Trabajador</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Estilos basados en la captura del login de trabajador */
        body {
            background-color: #dfdfdf; /* Fondo gris claro */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .login-card {
            background-color: #ffffff;
            width: 380px;
            padding: 20px 30px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
            text-align: center;
        }
        .logo-container img {
            max-width: 100%;
            height: auto;
            margin-bottom: 5px;
        }
        .separator {
            border-top: 2px solid #3b823e; /* Línea verde */
            margin: 15px 0;
        }
        .module-title {
            color: #3b823e;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 10px;
        }
        .logueo-bar {
            background-color: #3b823e;
            color: white;
            font-weight: bold;
            padding: 8px 0;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .input-group {
            display: flex;
            align-items: stretch; /* Para que los iconos tengan la misma altura que el input */
            margin-bottom: 12px;
            border: 1px solid #ccc;
        }
        .icon-box {
            background-color: #111111; /* Cuadro negro/oscuro del icono */
            color: white;
            padding: 10px;
            width: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .input-group input {
            border: none;
            outline: none;
            padding: 10px;
            flex-grow: 1;
            font-size: 12px;
            color: #555;
        }
        .icon-eye {
            background-color: #194a7a; /* Cuadro azul del ojo */
            color: white;
            padding: 10px;
            width: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .btn-validar {
            background-color: #194a7a; /* Azul institucional */
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn-validar:hover {
            background-color: #123557;
        }
        .modal-footer {
            color: #d90000;
            font-size: 11px;
            font-weight: bold;
            margin-top: 15px;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Logo -->
        <div class="logo-container">
            <img src="img/logo-uns.png" alt="Logo UNS">
        </div>
        
        <!-- Cabecera del formulario -->
        <div class="separator"></div>
        <div class="module-title">WEB COMEDOR UNIVERSITARIO</div>
        <div class="logueo-bar">LOGUEO</div>

        <!-- Formulario de logueo -->
        <form action="#" method="POST">
            
            <!-- Campo Usuario -->
            <div class="input-group">
                <span class="icon-box"><i class="fa-solid fa-user"></i></span>
                <input type="text" placeholder="INGRESE USUARIO *" required>
            </div>

            <!-- Campo IDCard -->
            <div class="input-group">
                <span class="icon-box"><i class="fa-solid fa-id-card-clip"></i></span>
                <input type="text" placeholder="INGRESE IDCARD *" required>
            </div>

            <!-- Campo Contraseña -->
            <div class="input-group">
                <span class="icon-box"><i class="fa-solid fa-lock"></i></span>
                <input type="password" placeholder="INGRESE CONTRASEÑA *" required>
                <span class="icon-eye"><i class="fa-solid fa-eye"></i></span>
            </div>

            <!-- Botón -->
            <button type="submit" class="btn-validar">VALIDAR ACCESO</button>
        </form>

        <!-- Footer versión -->
        <div class="modal-footer">
            PRODUCCION@UDEMSI Vr. 1.0.3Y
        </div>
    </div>

</body>
</html>
